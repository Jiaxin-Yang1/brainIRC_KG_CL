<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D UMAP Scatter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d0d; overflow: hidden; font-family: monospace; color: #fff; }
  #canvas-container { width: 100vw; height: 100vh; }
  #ui {
    position: fixed; top: 16px; left: 16px;
    background: rgba(0,0,0,0.55); padding: 12px 18px;
    border-radius: 10px; font-size: 13px; line-height: 2;
    pointer-events: none; border: 1px solid rgba(255,255,255,0.08);
  }
  #ui b { font-size: 14px; letter-spacing: 0.05em; }
  .dot { display: inline-block; width: 9px; height: 9px;
         border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  #status {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.65); padding: 7px 22px;
    border-radius: 20px; font-size: 12px; letter-spacing: 0.06em;
    border: 1px solid rgba(255,255,255,0.08);
  }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div id="ui">
  <b>3D UMAP-style Scatter</b><br/>
  <span class="dot" style="background:#f25a5a"></span>Cluster A<br/>
  <span class="dot" style="background:#5ac8f2"></span>Cluster B<br/>
  <span class="dot" style="background:#5af27a"></span>Cluster C<br/>
  <span class="dot" style="background:#f2cc45"></span>Cluster D<br/>
  <span class="dot" style="background:#c05af2"></span>Cluster E<br/>
  <br/>Mouse: drag · scroll to zoom
</div>
<div id="status">1 000 pts · 5 clusters · auto-rotating</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Minimal OrbitControls ──────────────────────────────────────────────────
THREE.OrbitControls = function(camera, domElement) {
  var scope = this;
  this.autoRotate = true;
  this.autoRotateSpeed = 1.2;
  this.enableDamping = true;
  this.dampingFactor = 0.06;

  var STATE = { NONE:-1, ROTATE:0 };
  var state = STATE.NONE;
  var EPS = 1e-6;
  var spherical = new THREE.Spherical();
  var sphericalDelta = new THREE.Spherical();
  var scale = 1;
  var target = new THREE.Vector3();
  var offset = new THREE.Vector3();
  var rotateStart = new THREE.Vector2();
  var rotateEnd   = new THREE.Vector2();
  var rotateDelta = new THREE.Vector2();

  offset.copy(camera.position).sub(target);
  spherical.setFromVector3(offset);

  function rotateLeft(a) { sphericalDelta.theta -= a; }
  function rotateUp(a)   { sphericalDelta.phi   -= a; }

  this.update = function() {
    offset.copy(camera.position).sub(target);
    spherical.setFromVector3(offset);
    if (scope.autoRotate && state === STATE.NONE)
      rotateLeft(2 * Math.PI / 60 / 60 * scope.autoRotateSpeed);
    spherical.theta += sphericalDelta.theta * (scope.enableDamping ? scope.dampingFactor : 1);
    spherical.phi   += sphericalDelta.phi   * (scope.enableDamping ? scope.dampingFactor : 1);
    spherical.phi = Math.max(EPS, Math.min(Math.PI - EPS, spherical.phi));
    spherical.radius = Math.max(5, Math.min(500, spherical.radius * scale));
    if (scope.enableDamping) {
      sphericalDelta.theta *= 1 - scope.dampingFactor;
      sphericalDelta.phi   *= 1 - scope.dampingFactor;
    } else sphericalDelta.set(0,0,0);
    scale = 1;
    offset.setFromSpherical(spherical);
    camera.position.copy(target).add(offset);
    camera.lookAt(target);
  };

  domElement.addEventListener('mousedown', function(e) {
    if (e.button === 0) { state = STATE.ROTATE; rotateStart.set(e.clientX, e.clientY); }
  });
  domElement.addEventListener('mousemove', function(e) {
    if (state === STATE.ROTATE) {
      rotateEnd.set(e.clientX, e.clientY);
      rotateDelta.subVectors(rotateEnd, rotateStart);
      rotateLeft(2 * Math.PI * rotateDelta.x / domElement.clientHeight);
      rotateUp  (2 * Math.PI * rotateDelta.y / domElement.clientHeight);
      rotateStart.copy(rotateEnd);
    }
  });
  domElement.addEventListener('mouseup', function() { state = STATE.NONE; });
  domElement.addEventListener('wheel', function(e) {
    e.preventDefault();
    scale = e.deltaY < 0 ? scale / 1.1 : scale * 1.1;
  }, { passive: false });

  var pinchStart = 0;
  var touch0 = new THREE.Vector2(), touch1 = new THREE.Vector2();
  domElement.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) { state = STATE.ROTATE; rotateStart.set(e.touches[0].clientX, e.touches[0].clientY); }
    else if (e.touches.length === 2) {
      touch0.set(e.touches[0].clientX, e.touches[0].clientY);
      touch1.set(e.touches[1].clientX, e.touches[1].clientY);
      pinchStart = touch0.distanceTo(touch1);
    }
  }, { passive: true });
  domElement.addEventListener('touchmove', function(e) {
    if (e.touches.length === 1 && state === STATE.ROTATE) {
      rotateEnd.set(e.touches[0].clientX, e.touches[0].clientY);
      rotateDelta.subVectors(rotateEnd, rotateStart);
      rotateLeft(2 * Math.PI * rotateDelta.x / domElement.clientHeight);
      rotateUp  (2 * Math.PI * rotateDelta.y / domElement.clientHeight);
      rotateStart.copy(rotateEnd);
    } else if (e.touches.length === 2) {
      touch0.set(e.touches[0].clientX, e.touches[0].clientY);
      touch1.set(e.touches[1].clientX, e.touches[1].clientY);
      var d = touch0.distanceTo(touch1);
      scale *= pinchStart / d; pinchStart = d;
    }
  }, { passive: true });
  domElement.addEventListener('touchend', function() { state = STATE.NONE; }, { passive: true });
};

// ── Scene ──────────────────────────────────────────────────────────────────
var container = document.getElementById('canvas-container');
var W = container.clientWidth, H = container.clientHeight;

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(W, H);
renderer.setClearColor(0x0d0d0d);
container.appendChild(renderer.domElement);

var scene  = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 2000);
camera.position.set(0, 0, 70);

var controls = new THREE.OrbitControls(camera, renderer.domElement);

scene.fog = new THREE.FogExp2(0x0d0d0d, 0.008);

// Subtle axis lines
function addAxis(dir, color) {
  var mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.2 });
  var geo = new THREE.BufferGeometry().setFromPoints([
    dir.clone().multiplyScalar(-25), dir.clone().multiplyScalar(25)
  ]);
  scene.add(new THREE.Line(geo, mat));
}
addAxis(new THREE.Vector3(1,0,0), 0xff4444);
addAxis(new THREE.Vector3(0,1,0), 0x44ff44);
addAxis(new THREE.Vector3(0,0,1), 0x4488ff);

window.addEventListener('resize', function() {
  W = container.clientWidth; H = container.clientHeight;
  camera.aspect = W / H; camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

// ── Pre-baked 3D Gaussian cluster data ────────────────────────────────────
// Mimics a UMAP 3D embedding: 5 well-separated, slightly elongated clusters
var CLUSTERS = [
  { center: [-18,  10,  -5], spread: [4.0, 2.5, 3.0], n: 200, color: [0.95, 0.35, 0.35] },
  { center: [ 14,  12,   8], spread: [2.5, 4.0, 2.0], n: 200, color: [0.35, 0.78, 0.95] },
  { center: [  2, -14,  12], spread: [3.0, 2.0, 4.5], n: 200, color: [0.35, 0.95, 0.48] },
  { center: [-10, -10, -14], spread: [2.0, 3.5, 2.5], n: 200, color: [0.95, 0.82, 0.28] },
  { center: [ 16,  -6, -10], spread: [3.5, 2.0, 3.0], n: 200, color: [0.80, 0.42, 0.95] },
];

function randn() {
  var u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

var totalPts = CLUSTERS.reduce(function(s, c) { return s + c.n; }, 0);
var positions = new Float32Array(totalPts * 3);
var colors    = new Float32Array(totalPts * 3);

var idx = 0;
CLUSTERS.forEach(function(cl) {
  // Random tilt axis per cluster for natural elongation
  var ax = randn(), ay = randn(), az = randn();
  var len = Math.sqrt(ax*ax + ay*ay + az*az);
  ax /= len; ay /= len; az /= len;
  var theta = Math.random() * Math.PI;
  var cosT = Math.cos(theta), sinT = Math.sin(theta);

  for (var i = 0; i < cl.n; i++) {
    var lx = randn() * cl.spread[0];
    var ly = randn() * cl.spread[1];
    var lz = randn() * cl.spread[2];

    // Rotate around the tilt axis
    var rx = cosT*lx + sinT*(ay*lz - az*ly);
    var ry = cosT*ly + sinT*(az*lx - ax*lz);
    var rz = cosT*lz + sinT*(ax*ly - ay*lx);

    positions[idx*3]     = cl.center[0] + rx;
    positions[idx*3 + 1] = cl.center[1] + ry;
    positions[idx*3 + 2] = cl.center[2] + rz;

    var j = (Math.random() - 0.5) * 0.14;
    colors[idx*3]     = Math.min(1, cl.color[0] + j);
    colors[idx*3 + 1] = Math.min(1, cl.color[1] + j);
    colors[idx*3 + 2] = Math.min(1, cl.color[2] + j);
    idx++;
  }
});

var geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color',    new THREE.BufferAttribute(colors,    3));

// Soft circular glow sprite via canvas texture
var cv = document.createElement('canvas');
cv.width = cv.height = 64;
var ctx = cv.getContext('2d');
var grd = ctx.createRadialGradient(32,32,0, 32,32,32);
grd.addColorStop(0.0, 'rgba(255,255,255,1.0)');
grd.addColorStop(0.4, 'rgba(255,255,255,0.85)');
grd.addColorStop(1.0, 'rgba(255,255,255,0.0)');
ctx.fillStyle = grd;
ctx.beginPath(); ctx.arc(32,32,32,0,Math.PI*2); ctx.fill();

var mat = new THREE.PointsMaterial({
  size: 1.1,
  vertexColors: true,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.90,
  depthWrite: false,
  map: new THREE.CanvasTexture(cv),
  alphaTest: 0.01,
});

scene.add(new THREE.Points(geo, mat));

// ── Animate ────────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
